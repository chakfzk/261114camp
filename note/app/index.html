<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>지구공학 생각 노트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Pen+Script&display=swap">
<style>
[hidden]{display:none!important}
body{margin:0}
/* Layout: 홈은 방법 카드 두 줄(태양빛 반사·이산화탄소 잡기), 활동은 화면을 꽉 채우는 2×2 사분면, 교사 화면은 방법 탭 + 4칸 답안 모음 */
:root{
  --paper:#f3f4f0; --card:#fbfbf8; --ink:#22303a; --muted:#5d6b66; --line:#d9ddd4;
  --sage:#4f7d62; --sage-soft:#e3ece4; --sun:#c8963a; --sun-soft:#f5ead2;
  --sea:#6f95a6; --sea-soft:#dde9ee; --violet:#7d5fa0; --violet-soft:#ece5f3;
  --rust:#b0583f; --rust-soft:#f4e3dc; --sand:#cdbf9f;
  --note1:#f6e58f; --note2:#cfe8c9; --note3:#f8d3c6; --note4:#d4e3f2; --note5:#ecd9f2; --note-ink:#2b2a22;
  --g1:#2f6f9f; --g1-soft:#e1ecf5; --g2:#8a4f9e; --g2-soft:#f0e5f4; --g3:#2b8273; --g3-soft:#dcefea; --g4:#a0662a; --g4-soft:#f5e8d8; --g5:#b04a6a; --g5-soft:#f5e1e8; --g0:#7a847f; --g0-soft:#ecefec;
  --teacher-bg:#e4ebf2;
  --pt1:#d6e1f0; --pt2:#d6e7cf; --pt3:#e4daf0; --pt4:#f3e49c; --pt5:#f2d4cb; --wall:#fbfaf6;
  --f-display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-hand:"Nanum Pen Script","IBM Plex Sans KR",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#161c1f; --card:#1e2629; --ink:#e7ece8; --muted:#9daaa4; --line:#33403f;
  --sage:#86b896; --sage-soft:#22332a; --sun:#e0b462; --sun-soft:#3a3122;
  --sea:#8fb6c6; --sea-soft:#1f3038; --violet:#b39ad3; --violet-soft:#2e2639;
  --rust:#e08f75; --rust-soft:#3a2722; --sand:#7d7259;
  --g1:#86b8e0; --g1-soft:#1d2d3a; --g2:#cc9fdc; --g2-soft:#302438; --g3:#74c7b6; --g3-soft:#1b322d; --g4:#e0a96a; --g4-soft:#3a2b1c; --g5:#e48fa8; --g5-soft:#3a2129; --g0:#a3aca7; --g0-soft:#262d2b;
  --note1:#e9d778; --note2:#b9d9b2; --note3:#eabfb0; --note4:#bed2e6; --note5:#d9c2e3; --note-ink:#24231c; --wall:#1a2023; --teacher-bg:#111a24; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#161c1f; --card:#1e2629; --ink:#e7ece8; --muted:#9daaa4; --line:#33403f;
  --sage:#86b896; --sage-soft:#22332a; --sun:#e0b462; --sun-soft:#3a3122;
  --sea:#8fb6c6; --sea-soft:#1f3038; --violet:#b39ad3; --violet-soft:#2e2639;
  --rust:#e08f75; --rust-soft:#3a2722; --sand:#7d7259;
  --g1:#86b8e0; --g1-soft:#1d2d3a; --g2:#cc9fdc; --g2-soft:#302438; --g3:#74c7b6; --g3-soft:#1b322d; --g4:#e0a96a; --g4-soft:#3a2b1c; --g5:#e48fa8; --g5-soft:#3a2129; --g0:#a3aca7; --g0-soft:#262d2b;
  --note1:#e9d778; --note2:#b9d9b2; --note3:#eabfb0; --note4:#bed2e6; --note5:#d9c2e3; --note-ink:#24231c; --wall:#1a2023; --teacher-bg:#111a24; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;touch-action:manipulation}   /* 두 번 탭해 확대하는 기능 끔(손가락으로 벌려 확대는 됨) */
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
/* 강사로 로그인한 동안은 바탕을 푸른 회색으로 바꿔 학생 화면과 구별 */
body.is-teacher{background:var(--teacher-bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 30px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
.eyebrow{font-size:13px;font-weight:600;color:var(--sage);letter-spacing:.06em}
.muted{color:var(--muted)}
.banner{border:1px solid var(--line);background:var(--sun-soft);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:14px}
.banner[hidden]{display:none}

/* top bar */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.bar .grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--sage)}
.btn.primary{background:var(--sage);border-color:var(--sage);color:var(--card)}
.btn.small{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--sage-soft);color:var(--sage);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}

/* home */
.hero{display:grid;grid-template-columns:1fr minmax(0,360px);gap:24px;align-items:end;margin-bottom:28px}
.hero h1{font-size:clamp(34px,5vw,52px);line-height:1.08;margin-top:6px}
.hero p{margin:10px 0 0;max-width:34em}
.who{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}
.who label{font-size:13px;font-weight:600;color:var(--muted)}
.who.teacher-mode{border-color:var(--sage);background:var(--sage-soft)}
.tm-h{display:flex;align-items:baseline;gap:10px}
.tm-h strong{font-family:var(--f-display);font-weight:400;font-size:24px;color:var(--sage)}
.tm-acts{display:flex;gap:8px;flex-wrap:wrap}
.pwrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.who .row{display:grid;grid-template-columns:84px 96px minmax(0,1fr);gap:8px}
.field{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 11px}
.section-h{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px;flex-wrap:wrap}
.section-h h2{font-size:24px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 16px;text-align:left;display:grid;gap:8px;position:relative;transition:border-color .15s, transform .15s}
.mcard:hover:not(:disabled){border-color:var(--sage);transform:translateY(-2px)}
.mcard:disabled{cursor:not-allowed;opacity:.55}
.mcard .art{background:var(--paper);border-radius:10px;aspect-ratio:16/9;display:grid;place-items:center;max-width:100%}
.mcard .art svg{width:78%;height:auto}
.grp{font-family:var(--f-body);font-size:.72em;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"] .grp{color:var(--paper);opacity:.75}
.mcard .t{font-family:var(--f-display);font-size:21px}
.mcard .s{font-size:13px;color:var(--muted)}
.mcard .tag{position:absolute;top:22px;left:22px;font-size:12px;font-weight:700;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.mcard.mine{border-color:var(--violet);box-shadow:inset 0 0 0 1px var(--violet)}
.mcard .tag.mine{background:var(--violet);color:var(--card);border-color:var(--violet)}
.gal-card{margin-top:22px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:16px 18px}
.gal-card h3{font-size:21px}
.who-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
/* 제목 옆 작은 체험실 버튼 */
.title-row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
/* 넓은 화면: 모둠·이름 블록의 윗줄을 '생쓰 캠프 · 3·4교시' 윗줄에 맞추고, 블록이 아래 '태양빛 반사' 줄 오른쪽 빈자리로 내려오게(카드를 밀지 않음) */
@media (min-width:861px){
  .hero{position:relative;grid-template-columns:1fr;align-items:start}
  .hero > .who{position:absolute;top:0;right:0;width:360px;z-index:1}
  .hero > div:first-child{padding-right:380px}
}

/* 개인정보 안내·동의 모달 (학생 첫 화면) */
.consent{position:fixed;inset:0;z-index:70;background:rgba(22,28,31,.55);display:grid;place-items:center;overflow:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.consent .box{background:var(--card);color:var(--ink);border-radius:16px;max-width:560px;width:100%;padding:22px 22px 18px;box-shadow:0 24px 48px -20px rgba(0,0,0,.45);display:grid;gap:12px}
.consent h2{font-size:26px}
.consent ul{margin:0;padding-left:20px;display:grid;gap:6px;font-size:15px}
.consent .more{font-size:14px;color:var(--sea);font-weight:600}
.consent .agree{display:flex;gap:10px;align-items:center;background:var(--sage-soft);border-radius:10px;padding:10px 12px;font-weight:600;cursor:pointer}
.consent .agree input{width:20px;height:20px;accent-color:var(--sage);margin:0}
.consent .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.consent .acts .grow{flex:1}
.icon-btn{padding:6px 9px;color:var(--rust)}
.icon-btn svg{display:block}
.consent .rbody .tcol, .consent .rbody{background:transparent;border:0;padding:0}
.consent .rcards{display:grid;gap:10px}
.consent .rcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;background:var(--card)}
.consent .rcard h3{font-size:17px;margin:0}
.consent .rcard p{margin:0;font-size:14px}
.consent .rnote{margin:0 2px;font-size:13px}
.consent .rnote ul{margin:4px 0 0;padding-left:18px;gap:2px;font-size:13px}
.consent .rdev{margin-top:8px;border-style:dashed}
.consent.confirm{z-index:80}
.btn.danger-solid{background:var(--rust);border-color:var(--rust);color:var(--card)}
.consent .no-msg{font-size:14px;color:var(--rust);margin:0}
.consent .crow{display:grid;grid-template-columns:auto 110px minmax(0,1fr);gap:8px;align-items:center}
.consent .ccls{font-weight:700;padding:0 4px}

/* work: 2x2 quadrants */
.quad{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(300px,auto);gap:14px}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.q-h{display:flex;align-items:center;gap:8px;justify-content:space-between}
.q-h h3{font-size:22px;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.q.principle .dot{background:var(--sea)} .q.pc .dot{background:var(--sage)} .q.value .dot{background:var(--sun)}
.q textarea{flex:1;width:100%;min-height:120px;resize:vertical;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:12px;line-height:1.6}
.q textarea:focus{border-color:var(--sage);outline:none}
.save{font-size:12px;color:var(--muted);white-space:nowrap}
.pc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1}
.pc-col{display:flex;flex-direction:column;gap:6px;min-width:0}
.pc-col .lab{font-size:13px;font-weight:700}
.pc-col.pro .lab{color:var(--sage)} .pc-col.con .lab{color:var(--rust)}
.illus{flex:1;background:var(--paper);border-radius:12px;display:grid;place-items:center;padding:10px;min-height:180px}
.illus svg{width:min(100%,420px);height:auto}
.hint{border-radius:12px;padding:12px 14px;font-size:14px}
.hint.locked{background:var(--paper);color:var(--muted);border:1px dashed var(--line)}
.hint.open{background:var(--sun-soft);border:1px solid var(--sun)}
.hint.open b{display:block;font-size:12px;color:var(--sun);letter-spacing:.04em;margin-bottom:2px}
.hint.open.cons{background:var(--rust-soft);border-color:var(--rust)}
.hint.open.cons b{color:var(--rust)}
.hint ul{margin:4px 0 0;padding-left:18px}
.pop{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.96);opacity:.3}100%{transform:none;opacity:1}}

/* teacher */
.tabs{display:grid;gap:8px;margin-bottom:14px}
.gcbox{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.gcbox .gcsel{width:auto;padding:6px 10px;border-radius:999px;background:var(--card);color:var(--ink);font-weight:600}
/* 방법 탭: 태양빛 반사 한 줄, 이산화탄소 잡기 한 줄, 줄마다 같은 폭 3칸 */
.tabrow{display:grid;grid-template-columns:110px minmax(0,1fr) 132px;gap:8px;align-items:center}
.tabside{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.tabside .toggle{padding:4px 10px 4px 4px;font-size:13px}
.tabside .btn{justify-content:center}
.tablab{font-family:var(--f-display);font-size:17px;color:var(--muted)}
.tabgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tabgrid .tab{min-width:0;width:100%;height:100%}
.tabwrap{position:relative;min-width:0}
.tab-x{position:absolute;top:6px;right:6px;border:1px solid var(--line);background:var(--card);color:var(--rust);border-radius:999px;min-width:30px;height:30px;padding:0 8px;display:grid;place-items:center;font-size:13px;font-weight:700;opacity:0;transition:opacity .15s}
.tab-x svg{display:block}
.tabwrap:hover .tab-x,.tab-x:focus-visible{opacity:1}
@media (hover:none){ .tab-x{opacity:.6} }
@media (max-width:700px){ .tabrow{grid-template-columns:1fr} .tabgrid{grid-template-columns:1fr} .tabside{flex-direction:row} .tabside:empty{display:none} }
.tab{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:14px;text-align:left}
.tab small{display:block;font-size:11px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tab[aria-selected="true"] small{color:var(--paper);opacity:.75}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.toggle{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 6px;background:var(--paper);font-size:14px;font-weight:500}
.toggle .sw{width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;transition:background .15s}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--card);transition:left .15s}
.toggle[aria-pressed="true"] .sw{background:var(--sage)}
.toggle[aria-pressed="true"] .sw::after{left:16px}
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tcol{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0;display:flex;flex-direction:column;gap:8px}
.tcol h3{font-size:20px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.tcol h3 .n{font-family:var(--f-body);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.alist{display:grid;gap:8px;max-height:420px;overflow:auto;padding-right:2px}
.ans{position:relative;background:var(--paper);border-radius:10px;padding:9px 11px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.ans-x{position:absolute;top:6px;right:6px;border:1px solid var(--line);background:var(--card);color:var(--rust);border-radius:999px;min-width:28px;height:28px;padding:0 7px;display:grid;place-items:center;font-size:12px;font-weight:700;opacity:0;transition:opacity .15s;white-space:nowrap}
.ans-x svg{display:block;width:14px;height:14px}
.ans:hover .ans-x,.ans-x:focus-visible{opacity:1}
.ans-confirm{position:absolute;top:5px;right:5px;display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--rust);border-radius:999px;padding:3px 4px 3px 12px;font-size:13px;font-weight:700;color:var(--rust);white-space:nowrap}
.ans-confirm .btn{padding:3px 10px;font-size:12px}
@media (hover:none){ .ans-x{opacity:.6} }
.ans .who{all:unset;display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:2px}
.ans.pro{border-left:3px solid var(--sage)} .ans.con{border-left:3px solid var(--rust)}
.empty{font-size:14px;color:var(--muted);padding:10px 0}
.danger{color:var(--rust);border-color:var(--rust-soft)}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
/* 모둠 수만큼 한 줄: 4·5모둠이면 카드가 좁아지므로 화면 폭을 넓히고 그림을 위로 올림 */
.gal.n4{grid-template-columns:repeat(4,minmax(0,1fr))} .gal.n5{grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.wrap.wide{max-width:1500px}
/* 활동 화면: 왼쪽 열 시뮬레이션 2 : 원리 1, 오른쪽 열 장점 : 단점 : 부가적 가치 = 1 : 1 : 1 */
.quad.work{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);grid-template-rows:repeat(3,minmax(0,1fr));grid-auto-rows:unset;
  grid-template-areas:"sim pro" "sim con" "pri val";height:max(600px,calc(100vh - 130px))}
.quad.work .q.sim{grid-area:sim} .quad.work .q.principle{grid-area:pri} .quad.work .pro-c{grid-area:pro} .quad.work .con-c{grid-area:con} .quad.work .q.value{grid-area:val}
.quad.work .q{padding:12px 14px;gap:8px;min-height:0}
.quad.work .q-h h3{font-size:19px}
.quad.work .q textarea{min-height:0;resize:none}
.quad.work .labbox{min-height:0}
.q.con-c .dot{background:var(--rust)}
/* 답 칸과 생각의 실마리를 옆으로(열). 실마리가 닫혀 있으면 제목 옆 작은 글씨만 */
.qbody{flex:1;display:flex;gap:10px;min-height:0}
.qbody textarea{flex:3;min-width:0}
.qbody .hint.locked{display:none}
.qbody .hint.open{flex:2;min-width:0;overflow:auto;margin:0;font-size:13px;padding:10px 12px}
.lk{font-size:12px;font-weight:400;color:var(--muted);margin-left:4px;font-family:var(--f-body);letter-spacing:0}
.q:has(.hint.open) .lk{display:none}
@media (max-width:900px){.quad.work{grid-template-columns:1fr;grid-template-rows:none;grid-template-areas:none;height:auto}.quad.work .q{grid-area:auto!important;min-height:220px}.quad.work .q.sim{min-height:380px}}
/* 체험실(작은 화면 모드)을 끼워 넣는 칸. 크게 보기를 누르면 화면을 덮음 */
.labbox{position:relative;flex:1;min-height:330px;border-radius:12px;overflow:hidden;background:var(--paper)}
.labbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.labbox .labwait{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px}
.q.sim.big{position:fixed;inset:14px;z-index:60;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.q.sim.big .labbox{min-height:0}

function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)){
    if(v==null||v===false) continue;
    if(k==="class") el.className=v;
    else if(k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if(k==="html") el.innerHTML=v;
    else el.setAttribute(k, v===true?"":v);
  }
  for(const k of kids.flat()){ if(k==null||k===false) continue; el.append(k.nodeType?k:document.createTextNode(String(k))); }
  return el;
}

/* 서버 부르기: Content-Type을 따로 정하지 않은 POST(text/plain)라 사전 확인 요청 없이 바로 감.
   credentials:"omit" = 구글 로그인 정보(쿠키)를 보내지 않음 → 로그인하지 않은 기기와 똑같이 처리됨 */
function call(fn, ...args){
  if(!hasGAS) return new Promise((res,rej)=>setTimeout(()=>{ try{ res(MOCK[fn](...args)); }catch(e){ rej(e); } }, 60));
  const ctl = new AbortController(), t = setTimeout(()=>ctl.abort(), 45000);
  return fetch(API_URL, {method:"POST", body:JSON.stringify({fn, args}), credentials:"omit", redirect:"follow", cache:"no-store", signal:ctl.signal})
    .then(r=>{ if(!r.ok) throw new Error("서버 응답 "+r.status); return r.json(); })
    .then(o=>{ if(!o || !o.ok) throw new Error((o&&o.error) || "서버 오류"); return o.r; })
    .finally(()=>clearTimeout(t));
}

let ctlPending = 0, ctlSeq = 0;
async function setControl(patch){
  const before = JSON.stringify(S.control);
  const c = S.control[tCls] = {...(S.control[tCls]||{})};
  if(patch.gallery!==undefined) c.gallery=!!patch.gallery;
  for(const k of ["reveal","hint"]) if(patch[k]) c[k]={...(c[k]||{}),...patch[k]};
  if(patch.groups!==undefined){ c.groups=Number(patch.groups);   // 4·5모둠 배정은 서버가 정해 돌려줌
    const as={...(c.assign||{})}; for(const g of Object.keys(as)) if(Number(g)>c.groups) delete as[g]; c.assign=as; }
  onData();
  const my = ++ctlSeq; ctlPending++;
  let r = null, ok = true;
  try{ r = await call("setControl", pw, tCls, patch); }
  catch(e){ ok = false; showBanner((e && e.message) ? "저장하지 못했어요: "+e.message : "저장하지 못했어요. 잠시 뒤 다시 시도해 주세요."); }
  ctlPending--;
  if(my===ctlSeq){ if(ok) apply(r); else { S.control=JSON.parse(before); onData(); } }   // 더 뒤에 누른 것이 있으면 이 응답은 버림

/* 초기화 회차: 강사가 초기화할 때마다 서버의 epoch가 바뀜. 이 기기가 기억한 회차와 다르면
   지난 회차의 모둠·이름·동의를 지우고 동의 창부터 다시(시험 기기를 하나씩 정리하지 않아도 되게). 화면에는 보이지 않음
   geo-epoch "?": 첫 자료를 받기 전에 동의한 기기(지우지 않고 지금 회차로 맞춤) */
function checkEpoch(){
  if(!S.epoch) return;
  const e = ls.get("geo-epoch");
  if(e===S.epoch) return;
  ls.set("geo-epoch", S.epoch);
  if(e==="?" || !(me.group || me.name || consented())) return;
  ["geo-consent","geo-consent-at","geo-consent-logged"].forEach(k=>ls.del(k));
  me = {key:rid(), cls:FIXED_CLS}; saveMe(); whoPending=false;
  if(!isTeacher) go({name:"home"});
}
const CLASSES = FIXED_CLS? [FIXED_CLS] : [1,2,3,4,5];
let tCls = FIXED_CLS || 1;   // 강사가 보고 있는 반
const CO2 = METHODS.filter(m=>m.kind==="co2");
const gOf = d=> Number(d.group)||0;
// 반마다 모둠 수(3~5)와 4·5모둠의 방법은 강사 화면에서 정해 control에 저장됨
// 기본 5모둠(서버가 처음 열릴 때 정함)
function groupCount(cls){ const n=Number((S.control[cls]||{}).groups)||5; return Math.min(5,Math.max(3,n)); }
function groupList(cls){ return Array.from({length:groupCount(cls)},(_,i)=>i+1); }
function methodOfGroup(g, cls){ g=Number(g)||0; const base=CO2.find(m=>m.group===g); if(base) return base.id;
  if(!g || g>groupCount(cls)) return null; return ((S.control[cls]||{}).assign||{})[g] || null; }
function groupsOf(mid, cls){ return groupList(cls).filter(g=>methodOfGroup(g,cls)===mid); }   // 그 방법을 맡은 모둠들
// 맡은 모둠 표시: 방법 이름 뒤에 괄호로 "(1모둠, 5모둠)"
const gNames = (mid, cls)=> "("+groupsOf(mid,cls).map(g=>g+"모둠").join(", ")+")";
function answerId(m){ return M[m].kind==="solar" ? `s|${m}|${me.cls}|${me.group}|${me.name}`   // 선생님과 함께: 학생마다 따로
                                     : groupId(m, isTeacher? tCls : me.cls, workGroup(m)); }   // 모둠 활동: 모둠이 함께 쓰는 한 칸
// 이산화 탄소 방법을 쓸 모둠: 고른 모둠이 그 방법을 맡았으면 그 모둠, 아니면(강사가 다른 방법을 열 때) 1~3모둠 중 그 방법의 모둠
function workGroup(m){ if(isTeacher) return M[m].group; return methodOfGroup(myGroup(), myCls())===m ? myGroup() : M[m].group; }   /* 강사 모드는 모둠을 고르지 않으므로 1~3모둠 칸 */
const groupId = (m, cls, g)=> `g|${m}|${cls}|${g}`;
// 강사 화면·발표 화면에 올릴 답: 이산화 탄소 방법은 지금 그 방법을 맡은 모둠의 칸만
// 이 반에서 그 방법을 맡은 모둠들이 받은 포스트잇
// 포스트잇은 받은 모둠(tg) 단위. 이 반에서 그 방법을 맡은 모둠들이 받은 것
function notesFor(mid, cls){ const gs=groupsOf(mid,cls); return [...S.notes.values()].filter(n=>n.method===mid && clsOf(n)===cls && gs.includes(Number(n.tg)||0)); }
function onBoard(d, mid, cls){ return clsOf(d)===cls && d.method===mid &&
  (M[mid].kind==="solar" || (groupsOf(mid,cls).includes(gOf(d)) && d.id===groupId(mid,cls,gOf(d)))); }
// 답이 있는 모둠까지 포함한 모둠 목록(모둠 수를 줄여도 태양빛 답이 사라지지 않게), 모둠 미정(0)은 맨 뒤
function shownGroups(cls, list){ const s=new Set(groupList(cls)); list.forEach(d=>{ if(gOf(d)) s.add(gOf(d)); });
  const gs=[...s].sort((a,b)=>a-b); if(list.some(d=>!gOf(d))) gs.push(0); return gs; }
function myGroup(){ return Number(me.group)||0; }
function myCls(){ return Number(me.cls)||0; }
function viewCls(){ return isTeacher? tCls : myCls(); }       // 화면에 보여줄 반
function ctl(){ return S.control[viewCls()] || {}; }          // 그 반의 힌트·공유 상태
function gallOpen(){ return !!ctl().gallery; }
const clsOf = d=> Number(d.cls)||0;

/* ---------- HOME ---------- */
function renderHome(){
  const nameIn = h("input",{class:"field",id:"nm",placeholder:"예: 김지구",value:me.name||"",maxlength:"20",autocomplete:"off",oninput:e=>{me.name=e.target.value.trim(); saveMe();}});
  if(S.v!==null && myGroup()>groupCount(myCls())){ me.group=""; saveMe(); }   // 선생님이 모둠 수를 줄였을 때
  const grpSel = h("select",{class:"field",id:"gp",onchange:e=>{me.group=e.target.value; saveMe(); render();}},

  // teacher login

  const pwForm = h("form",{class:"pwrow",onsubmit:async e=>{ e.preventDefault(); const ok = await call("checkTeacher", pwIn.value).catch(()=>false); if(ok){ pw=pwIn.value; ls.set("geo-pw",pw); ls.set("geo-pw-day",today_()); isTeacher=true; pwMode=false; go({name:"home"}); } else pwMsg.textContent="비밀번호가 달라요"; }},
    pwIn, h("button",{class:"btn small primary",type:"submit"},"확인"));
  const teacherBtn = h("button",{class:"btn small",onclick:()=>{ pwMode=true; render(); }},"강사");
  // 강사로 로그인하면 모둠·이름 칸 대신 '강사 모드' 블록
  const whoBox = (!isTeacher && pwMode)

        h("div",{class:"who-h"}, h("div",{class:"tm-h"}, h("strong",null,"강사 로그인")),
          h("button",{class:"btn small",onclick:()=>{ pwMode=false; render(); }},"취소")),
        pwForm, pwMsg)
    : isTeacher
    ? h("div",{class:"who teacher-mode"},
        h("div",{class:"tm-h"}, h("strong",null,"강사 모드"), h("span",{class:"muted"}, tCls+"반")),
        h("div",{class:"tm-acts"},
          h("button",{class:"btn small primary",onclick:()=>go({name:"teacher"})},"강사 화면"),
          h("button",{class:"btn small",onclick:askLogout},"강사 로그아웃")))
    : h("div",{class:"who"},
        h("div",{class:"who-h"}, h("label",{for:me.cls?"gp":"cl"}, me.cls? "모둠과 이름을 먼저 적어 주세요" : "우리 반을 고르면 그 반 화면이 새 탭으로 열려요"), teacherBtn),
        h("div",{class:"row"}, clsSel, me.cls? grpSel : h("span"), me.cls? nameIn : h("span")));

  const hero = h("div",{class:"hero"},
    h("div",null,
      h("div",{class:"eyebrow"},"생쓰 캠프 · 3·4교시"),
      h("div",{class:"title-row"}, h("h1",null,"지구공학 생각 노트"))),
    whoBox);

  const solar = h("div",{class:"cards"}, METHODS.filter(m=>m.kind==="solar").map(m=>
    h("button",{class:"mcard",onclick:()=>{ if(!need()) go({name:"work",method:m.id}); }},
      h("div",{class:"art",html:ART[m.id]}), h("div",{class:"t"},m.title))));
  const co2 = h("div",{class:"cards"}, METHODS.filter(m=>m.kind==="co2").map(m=>{
    const c = isTeacher? tCls : myCls();
    const mine = !isTeacher && methodOfGroup(myGroup(), c)===m.id, lock = !mine && !isTeacher && !!me.group;
    return h("button",{class:"mcard"+(mine?" mine":""),disabled:lock,onclick:()=>{ if(!need() && (mine||isTeacher)) go({name:"work",method:m.id}); }},
      mine? h("span",{class:"tag mine"},"우리 모둠") : null,
      h("div",{class:"art",html:ART[m.id]}), h("div",{class:"t"},m.title," ",h("span",{class:"grp"},gNames(m.id,c))));
  }));
  const galBtn = h("button",{class:"btn primary",onclick:()=>{ if(!need()||isTeacher) go({name:"gallery"}); }},"모둠 결과 둘러보기 →");
  const syncGal = ()=>{ const open=gallOpen()||isTeacher; galBtn.disabled=!open; };
  syncGal(); refreshers.push(syncGal);

  // 개인정보 안내·동의: 동의 전에는 첫 화면 위에 띄우고, 동의는 이 기기에 기억함
  // 개인정보 안내 + 모둠·이름 입력 + 동의를 한 창에서 받고, 동의하는 순간 '동의기록'에 남김
  const chk = h("input",{type:"checkbox",id:"agree"});
  const cGrp = h("select",{class:"field",id:"c-gp","aria-label":"모둠"});
  const fillGroups = ()=>{ const v=cGrp.value||String(me.group||"");
    cGrp.replaceChildren(h("option",{value:""},"모둠"), ...groupList(myCls()).map(n=>h("option",{value:n,selected:String(v)===String(n)},n+"모둠"))); };
  fillGroups(); refreshers.push(fillGroups);   // 선생님이 모둠 수를 4·5로 정하면 선택지도 늘어남
  const cName = h("input",{class:"field",id:"c-nm",placeholder:"이름",maxlength:"20",autocomplete:"off",value:me.name||""});
  const cMsg = h("p",{class:"no-msg",hidden:true});
  const okBtn = h("button",{class:"btn primary",onclick:async()=>{
    const g=cGrp.value, n=cName.value.trim();
    const miss = !g? "모둠을 골라 주세요." : !n? "이름을 적어 주세요." : !chk.checked? "동의에 체크해 주세요." : "";
    if(miss){ cMsg.textContent=miss; cMsg.hidden=false; (!g? cGrp : !n? cName : chk).focus(); return; }
    me.group=g; me.name=n; saveMe(); whoPending=false;   // 방금 적은 사람이므로 '○모둠 ○○ 학생인가요?'를 묻지 않음
    const at=Date.now(); ls.set("geo-consent",CONSENT_VER); ls.set("geo-consent-at",at); ls.set("geo-epoch", S.v===null? "?" : S.epoch);
    modal.remove(); render();
    const cm=consentMeta();   // 바로 기록. 실패하면 첫 저장 때 다시 보냄
    if(cm) call("recordConsent",{ver:cm.ver,agreedAt:at,key:me.key,cls:myCls(),group:myGroup(),name:me.name}).then(()=>consentLogged(cm)).catch(()=>{});
  }},"동의하고 시작하기");
  const modal = h("div",{class:"consent",role:"dialog","aria-modal":"true","aria-labelledby":"consent-h"},
    h("div",{class:"box"},
      h("h2",{id:"consent-h"},"시작하기 전에 읽어 주세요"),
      h("ul",null,
        h("li",null,"입력한 반·모둠·이름과 작성한 답·포스트잇은 수업 기록을 위해 선생님의 구글 시트에 저장돼요. 구글 서버는 미국에 있어요."),
        h("li",null,"작성한 내용은 이름과 함께 같은 반 친구들과 선생님에게 보여요."),
        h("li",null,"저장된 내용은 2026년 12월 31일까지 보관한 뒤 삭제해요."),
        h("li",null,"동의하지 않으면 노트를 쓰지 않고 수업에 말로 참여할 수 있어요.")),
      h("a",{class:"more",href:PRIVACY_URL,target:"_blank",rel:"noopener"},"개인정보 처리방침 전체 보기 ↗"),
      h("div",{class:"crow"}, h("span",{class:"ccls"},myCls()+"반"), cGrp, cName),
      h("label",{class:"agree",for:"agree"}, chk, "위 내용을 읽고 동의합니다."),
      cMsg,
      h("div",{class:"acts"},
        h("button",{class:"btn small",onclick:()=>{ modal.remove(); pwMode=true; render(); }},"강사 로그인"),
        h("span",{class:"grow"}),
        h("button",{class:"btn",onclick:()=>{ cMsg.textContent="괜찮아요. 노트를 쓰지 않고 수업에 말로 참여하면 돼요."; cMsg.hidden=false; }},"동의하지 않아요"),
        okBtn)));
  function openConsent(){ if(!me.cls) return; if(!modal.isConnected){ chk.checked=false; cMsg.hidden=true; document.body.append(modal); } cGrp.focus(); }
  if(!isTeacher && !pwMode && !consented()) openConsent();
  else if(!pwMode && whoPending) askWho();
  if(pwMode && !isTeacher) setTimeout(()=>pwIn.focus(),0);

  app.append(hero,
    h("div",{class:"section-h"},h("h2",null,"태양빛 반사"),h("span",{class:"chip"},"선생님과 함께")), solar,
    h("div",{class:"section-h"},h("h2",null,"이산화탄소 잡기"),h("span",{class:"chip",style:"background:var(--violet-soft);color:var(--violet)"},"모둠 활동")), co2,
    h("div",{class:"gal-card"}, h("div",null,h("h3",null,"다른 모둠 결과 둘러보기")), galBtn));
}

/* ---------- WORK (2x2) ---------- */
let workTick = null;
function renderWork(mid){
  const m = M[mid]; const id = answerId(mid); const isGroup = m.kind==="co2";
  const wCls = isTeacher && isGroup? tCls : myCls(), wGrp = isGroup? workGroup(mid) : myGroup();
  const cur = ()=> (isTeacher && isGroup)? {} : (S.answers.get(id) || {});   /* 강사 모드의 모둠 활동은 여러 모둠이 맡으므로 한 모둠 답을 보여 주지 않음(답 보기는 강사 화면) */
  const pending = {}; let timer=null, saving=false, lastSaved=cur().updatedAt||0;
  const saveEls = [];
  async function flush(){
    timer=null; if(saving){ timer=setTimeout(flush,600); return; }
    const patch = {...pending}; if(!Object.keys(patch).length) return;
    for(const k in patch) delete pending[k];
    saving=true; paintSave();
    const cm = consentMeta();
    const ok = await write("saveAnswer", id, patch, {method:mid, kind:m.kind, cls:wCls, group:wGrp, name:me.name||"", consent:cm}, isTeacher?0:myCls());
    if(ok) consentLogged(cm);
    saving=false;
    if(ok) lastSaved=Date.now(); else { for(const k in patch) if(pending[k]===undefined) pending[k]=patch[k]; timer=setTimeout(flush, 5000 + Math.floor(Math.random()*5000)); }
    paintSave();
  }
  function paintSave(){ saveEls.forEach(s=>s.textContent = (saving||timer)? "저장 중…" : ago(lastSaved)); }
  clearInterval(workTick); workTick=setInterval(paintSave, 15000);

  const areas = {};
  function ta(field, ph){
    const t = h("textarea",{id:"ta-"+field, placeholder:ph, maxlength:"3000", readonly:isTeacher,   /* 강사 모드는 미리보기만 */
      oninput:e=>{ pending[field]=e.target.value; clearTimeout(timer); timer=setTimeout(flush, 5000); paintSave(); },
      onblur:()=>{ if(timer){ clearTimeout(timer); flush(); } }});
    t.value = cur()[field] || ""; areas[field]=t; return t;
  }
  const saveTag = ()=>{ const s=h("span",{class:"save"}); saveEls.push(s); return s; };

  const consHint = h("div"), valueHint = h("div");
  let lastC=null, lastV=null;
  function paintHints(){
    const c = !!(ctl().hint||{})[mid], v = !!(ctl().reveal||{})[mid];
    if(c!==lastC){ lastC=c; consHint.replaceChildren();
      if(c){ consHint.className="hint open cons pop"; consHint.append(h("b",null,"생각의 실마리"), h("ul",null, m.cons.map(x=>h("li",null,x)))); }
      else { consHint.className="hint locked"; consHint.textContent="막막하면 조금 기다려 보세요. 선생님이 힌트 질문을 열어 줄 거예요."; } }
    if(v!==lastV){ lastV=v; valueHint.replaceChildren();
      if(v){ valueHint.className="hint open pop"; valueHint.append(h("b",null,"생각의 실마리"), m.value); }
      else { valueHint.className="hint locked"; valueHint.textContent="막막하면 조금 기다려 보세요. 선생님이 힌트 질문을 열어 줄 거예요."; } }
  }
  paintHints();

  /* 시뮬레이션: 체험실의 이 방법 화면을 작은 화면 모드로 끼워 넣음.
     체험실이 '준비됨' 신호를 보내지 않으면(8초) 원래 그림과 '새 창에서 열기'로 바꿈 */
  const labUrl = LAB_URL+"?m="+mid+"&embed=1";
  const labFrame = h("iframe",{src:labUrl,title:m.title+" 시뮬레이션",allow:"fullscreen"});
  const labBox = h("div",{class:"labbox"}, h("div",{class:"labwait"},"시뮬레이션을 불러오는 중…"), labFrame);
  let labOk=false;
  const onLab = ev=>{ if(!ev.data||ev.source!==labFrame.contentWindow) return;
    if(ev.data.geolab==="ready"){ labOk=true; const w=labBox.querySelector(".labwait"); if(w) w.remove(); } };
  window.addEventListener("message", onLab);
  setTimeout(()=>{ if(labOk||!labBox.isConnected) return;
    labBox.replaceChildren(h("div",{class:"illus",html:ART[mid],style:"height:100%"}));
    bigBtn.replaceWith(h("a",{class:"btn small",href:LAB_URL+"?m="+mid,target:"_blank",rel:"noopener"},"새 창에서 열기 ↗")); }, 8000);
  let scrim=null;
  const setBig = on=>{ q1.classList.toggle("big",on); bigBtn.textContent=on?"원래 크기로":"크게 보기";
    if(on){ scrim=h("div",{class:"simscrim",onclick:()=>setBig(false)}); document.body.append(scrim); }
    else if(scrim){ scrim.remove(); scrim=null; } };
  const bigBtn = h("button",{class:"btn small",onclick:()=>setBig(!q1.classList.contains("big"))},"크게 보기");
  document.addEventListener("keydown", function esc(e){ if(!q1.isConnected){ document.removeEventListener("keydown",esc); return; } if(e.key==="Escape"&&q1.classList.contains("big")) setBig(false); });
  /* 태양빛 반사 3가지(우주·하늘·지면)는 제목 양옆 ‹ › 로 서로 넘겨 봄(쓰던 답은 먼저 저장) */
  let carNav = [];
  function titleWithCarousel(){
    if(isGroup) return [h("h3",null,m.title)];
    const sol = METHODS.filter(x=>x.kind==="solar").map(x=>x.id), i = sol.indexOf(mid);
    /* 캐러셀: 지금 화면(.quad.work)을 제자리에 고정해 남겨 두고(iframe이 다시 불리지 않게 DOM에서 빼지 않음),
       새 화면을 그린 뒤 두 화면을 같은 시간·같은 곡선으로 함께 밀어 옮김. 끝나면 옛 화면을 지움(render·아래 마무리 코드) */
    const move = d=>{ const next=sol[i+d]; if(!next) return;   /* 끝에서 처음으로 돌아가지 않음 */
      if(document.body.classList.contains("carmove")) return;   /* 움직이는 중에는 또 누르지 못함 */
      if(timer){ clearTimeout(timer); flush(); }

/* 6번 '온실 효과와 지구 온난화'를 큰 창으로(원리 칸에서 화살표를 다시 보려고). 주소는 체험실 주소에서 만듦 */
function openGH(){
  /* 원리 칸은 쓸 수 있는 채로, 6번 탭 ①의 그림+농도 슬라이더(radiation/?embed&mini=1)를 오른쪽 열(장점·단점·부가적 가치) 위에 띄움. 다시 누르거나 [닫기]·Esc로 닫음 */
  const prev=document.querySelector(".ghside"); if(prev){ prev.__close(); return; }
  const a=document.querySelector(".quad.work .pro-c"), b=document.querySelector(".quad.work .q.value"); if(!a||!b) return;
  const url = LAB_URL.replace(/geoengineering\/?$/,"radiation/")+"?embed&mini=1";
  const place = ()=>{ const r1=a.getBoundingClientRect(), r2=b.getBoundingClientRect();
    Object.assign(wrap.style,{left:r1.left+"px",top:r1.top+"px",width:r1.width+"px",height:(r2.bottom-r1.top)+"px"}); };
  const close = ()=>{ wrap.remove(); removeEventListener("resize",place); document.removeEventListener("keydown",esc); };
  const esc = e=>{ if(e.key==="Escape") close(); };
  const wrap = h("section",{class:"ghside",role:"region","aria-label":"온실 효과와 지구 온난화 시뮬레이션"},
    h("div",{class:"gh-h"},h("strong",null,"'온실 효과와 지구 온난화' 시뮬레이션"),
      h("button",{class:"gh-x",onclick:()=>close(),"aria-label":"시뮬레이션 닫기",title:"닫기"},"✕ 닫기")),
    h("div",{class:"gh-b"},h("iframe",{src:url,title:"온실 효과와 지구 온난화"})));
  wrap.__close=close;
  document.body.append(wrap); place(); addEventListener("resize",place); document.addEventListener("keydown",esc);
}

/* 확인 모달: [취소] [지우기] 중 하나를 고를 때까지 기다림. 다른 창 위에도 뜸 */
function confirmModal(title, msg, okLabel, onOk, okClass){
  const close = ()=>{ wrap.remove(); document.removeEventListener("keydown", esc, true); };
  const esc = e=>{ if(e.key==="Escape"){ e.stopPropagation(); close(); } };
  const ok = h("button",{class:"btn "+(okClass||"danger-solid"),onclick:async()=>{ ok.disabled=true; close(); await onOk(); }}, okLabel||"지우기");
  const wrap = h("div",{class:"consent confirm",role:"alertdialog","aria-modal":"true","aria-labelledby":"cf-h",onclick:e=>{ if(e.target===wrap) close(); }},
    h("div",{class:"box",style:"max-width:440px"},
      h("h2",{id:"cf-h",style:"font-size:22px"},title),
      msg? h("p",{class:"muted",style:"margin:0;font-size:15px"},msg) : null,
      h("div",{class:"acts"}, h("span",{class:"grow"}), h("button",{class:"btn",onclick:close},"취소"), ok)));
  document.addEventListener("keydown", esc, true);
  document.body.append(wrap);
  setTimeout(()=>ok.focus(),0);
}
/* 데이터 정리 모달(강사 화면 오른쪽 위 휴지통 버튼): 모두 지우기, 답·포스트잇만 지우기, 이 기기의 이름·로그인 지우기 */

      h("div",{style:"display:flex;align-items:center;gap:8px"}, h("h2",{id:"reset-h",style:"flex:1"},"데이터 정리"),

    h("div",{class:"rcard rdev"}, h("h3",null,"이 기기의 이름·로그인 지우기"),

/* ---------- PRESENT (발표 화면: 모둠별 포스트잇 보드) ---------- */
const PFIELDS = [["principle","원리","과학적 원리는 무엇일까?"],["pros","장점","지구 온난화를 해결하는 데 유리한 점"],["cons","단점","걱정되는 점과 보완 방법"],["value","부가적 가치","기후 말고 또 어디에 도움이 될까?"]];
let pField = 0, pNames = true;
const pHidden = new Set();   // 발표 화면에서만 가린 포스트잇 (지우지 않음)
let pSpot = null;            // 확대 보기 조작 (키보드에서 사용)
function renderPresent(){
  if(!isTeacher){ go({name:"home"}); return; }
  const root = h("div",{class:"present"});
  const head = h("div",{class:"p-head"});
  const qline = h("div",{class:"p-q"});
  const board = h("div",{class:"p-board"});
  // 오른쪽 위 스위치들: 한 번만 만들고 상태만 바꿈(강사 화면의 질문 스위치와 같은 설정)
  const pHintT = h("button",{class:"toggle",onclick:()=>setControl({hint:{[tSel]:!(ctl().hint||{})[tSel]}})},h("span",{class:"sw"}),"단점 질문");
  const pRevT  = h("button",{class:"toggle",onclick:()=>setControl({reveal:{[tSel]:!(ctl().reveal||{})[tSel]}})},h("span",{class:"sw"}),"부가적 가치 질문");
  const pNameT = h("button",{class:"toggle",onclick:()=>{ pNames=!pNames; paint(); }},h("span",{class:"sw"}),"이름");
  const pTools = h("div",{class:"p-tools"}, pHintT, pRevT, pNameT,
    h("button",{class:"btn",onclick:()=>{ if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); go({name:"teacher"}); }},"닫기 ✕"));
  const pTitle = h("div",{class:"p-title"}), pFields = h("div",{class:"p-fields",role:"tablist"});
  head.append(pTitle, pFields, pTools);
  const spot = h("div",{class:"p-spot",hidden:true,onclick:()=>{ if(!spot.dataset.swiped) closeSpot(); }});
  let seq = [], spotIdx = -1;     // 보드에 붙은 순서대로 모은 포스트잇, 확대 중인 번호
  function closeSpot(){ spotIdx=-1; spot.hidden=true; spot.replaceChildren(); }
  function drawSpot(){
    if(spotIdx<0 || !seq.length){ closeSpot(); return; }
    if(spotIdx>=seq.length) spotIdx=seq.length-1;
    const it=seq[spotIdx], stop=e=>e.stopPropagation();
    const edge = d=> spotIdx+d<0 || spotIdx+d>=seq.length;          // 이 질문의 끝인가
    const nav=(d,lab,txt)=> h("button",{class:"p-nav"+(edge(d)?" jump":""),disabled:edge(d) && nextField(d)<0,"aria-label":edge(d)? (d>0?"다음 질문":"이전 질문") : lab,
      title:edge(d)? (d>0?"다음 질문으로":"이전 질문으로") : lab, onclick:e=>{ stop(e); move(d); }},txt);
    spot.replaceChildren(
      h("div",{class:"p-spot-top",onclick:stop},
        h("span",{class:"p-qtag "+PFIELDS[pField][0]}, PFIELDS[pField][1]),
        h("span",{class:"p-count"}, (spotIdx+1)+" / "+seq.length),
        it.tag? h("span",{class:"gchip g"+it.g}, it.tag) : null,
        h("span",{class:"p-spot-help"},"포스트잇을 누르거나 ← → 로 넘기기 · Esc 닫기"),
        h("button",{class:"p-close","aria-label":"확대 닫기",onclick:e=>{ stop(e); closeSpot(); }},"✕")),
      h("div",{class:"p-spot-row"},
        nav(-1,"이전 포스트잇","‹"),
        h("div",{class:"p-spot-note c"+it.c,title:"누르면 다음 포스트잇",onclick:e=>{ stop(e); move(1); }}, h("div",{class:"p-txt"},it.text), pNames && it.who? h("div",{class:"p-who"},it.who):null),
        nav(1,"다음 포스트잇","›")));
    spot.hidden=false;
  }
  // 이 질문에서 더 넘길 포스트잇이 없으면, 포스트잇이 있는 다음(이전) 질문으로 이어서 넘어감
  function nextField(d){
    for(let f=pField+d; f>=0 && f<PFIELDS.length; f+=d) if(countField(f)>0) return f;
    return -1;
  }
  function move(d){
    const n=spotIdx+d;
    if(n>=0 && n<seq.length){ spotIdx=n; drawSpot(); return; }
    const f=nextField(d); if(f<0) return;
    pField=f; paint(); spotIdx = d>0? 0 : seq.length-1; drawSpot();
  }
  // 스와이프(전자칠판·태블릿)
  let sx=null;
  spot.addEventListener("pointerdown", e=>{ sx=e.clientX; });
  spot.addEventListener("pointerup", e=>{ if(sx==null) return; const dx=e.clientX-sx; sx=null; if(Math.abs(dx)>70){ spot.dataset.swiped="1"; move(dx<0?1:-1); setTimeout(()=>{ delete spot.dataset.swiped; },50); } });
  const openAt = i=>{ spotIdx=i; drawSpot(); };
  pSpot = { isOpen:()=>spotIdx>=0, move, close:closeSpot };
  const hue = key=>{ let x=2166136261; for(const ch of String(key)){ x^=ch.charCodeAt(0); x=Math.imul(x,16777619)>>>0; } return x; };
  const note = (text, who, g, i, key)=>{
    const k=hue(key||text), c=1+((i+g*2)%5), r=[-1.4,0.9,-0.5,1.3,-1,0.6,-1.7,1.1][k%8];

      key? h("button",{class:"p-x","aria-label":"발표 화면에서 가리기",title:"발표 화면에서 가리기",onclick:e=>{ e.stopPropagation(); pHidden.add(key); paint(); }},"×") : null,
      h("div",{class:"p-txt"},text), pNames && who? h("div",{class:"p-who"},who) : null);
  };
  const fit = (texts)=>{  // 답 개수와 길이에 맞춰 글자 크기 조절
    const n=texts.length||1, avg=texts.reduce((a,t)=>a+t.length,0)/n;
    let fs = n<=4? 24 : n<=8? 21 : n<=14? 18 : 16;
    if(avg>60) fs-=1; if(avg>110) fs-=1;
    board.style.setProperty("--fs", fs+"px");
    board.style.setProperty("--nw", Math.round(fs*9.5)+"px");
  };

  function countField(fi){
    const m=M[tSel], f=PFIELDS[fi][0];
    const a=[...S.answers.values()].filter(d=>onBoard(d,tSel,tCls) && (d[f]||"").trim() && !pHidden.has(d.id+"|"+f)).length;
    const n=f==="value" && m.kind==="co2"? notesFor(tSel,tCls).filter(x=>!pHidden.has(x.id)).length : 0;
    return a+n;
  }
  function paint(){
    const m = M[tSel], [field,label,q] = PFIELDS[pField];
    seq = [];
    const keyOf = d=> d.id+"|"+field;
    const all = [...S.answers.values()].filter(d=>onBoard(d,tSel,tCls) && (d[field]||"").trim())
      .sort((a,b)=>(a.updatedAt||0)-(b.updatedAt||0));
    const rows = all.filter(d=>!pHidden.has(keyOf(d)));
    const hiddenN = all.length-rows.length;
    const notesAll = field==="value" && m.kind==="co2"? notesFor(tSel,tCls) : [];
    // 제목과 질문 탭만 다시 그림. 오른쪽 스위치 묶음(pTools)은 그대로 두어야 스위치가 부드럽게 움직임
    pTitle.replaceChildren(
        h("span",null,tCls+"반"), h("span",{class:"sep"},"·"),
        h("select",{class:"p-method","aria-label":"방법 고르기",onchange:e=>{ tSel=e.target.value; paint(); }},
          METHODS.map(x=>h("option",{value:x.id,selected:x.id===tSel}, x.kind==="co2"? x.title+" ("+groupsOf(x.id,tCls).map(g=>g+"모둠").join(", ")+")" : x.title))));
    pFields.replaceChildren(...PFIELDS.map(([f,l],i)=>{
        const n=[...S.answers.values()].filter(d=>onBoard(d,tSel,tCls) && (d[f]||"").trim()).length;

      }));

    pRevT.setAttribute("aria-pressed", String(!!(ctl().reveal||{})[tSel]));
    pNameT.setAttribute("aria-pressed", String(pNames));
    const showQ = field!=="value" || (ctl().reveal||{})[tSel];
    qline.replaceChildren(h("span",{class:"p-qlab "+field},label), h("span",null, field==="value" && showQ? m.value : q),
      ...(hiddenN? [h("span",{class:"p-hidden"}," 가린 포스트잇 "+hiddenN+"장", h("button",{onclick:()=>{ [...pHidden].filter(k=>k.endsWith("|"+field)).forEach(k=>pHidden.delete(k)); paint(); }},"다시 보이기"))] : []));

    if(m.kind==="solar"){
      fit(rows.map(d=>d[field]));
      const gs=shownGroups(tCls, rows);
      board.className="p-board cols"+gs.length;
      board.replaceChildren(...gs.map(g=>{
        const mine=rows.filter(d=>gOf(d)===g);
        return h("section",{class:"p-col g"+g},
          h("div",{class:"p-colhead"}, h("span",{class:"gchip g"+g}, g? g+"모둠":"모둠 미정"), h("span",{class:"p-n"}, mine.length+"명")),
          h("div",{class:"p-notes"}, mine.length? mine.map((d,i)=>note(d[field], d.name, g, i, keyOf(d))) : h("div",{class:"p-empty"},"아직 없음")));
      }));
    } else {
      const ns = notesAll.filter(n=>!pHidden.has(n.id)).sort((a,b)=>a.at-b.at);
      fit([...rows.map(d=>d[field]), ...ns.map(n=>n.text)]);
      const gs = groupsOf(tSel,tCls);   // 이 방법을 맡은 모둠들 (1~3모둠 하나 + 배정된 4·5모둠)
      const pn = (n,i)=> note(n.text, (n.name||"")+(n.group?" · "+n.group+"모둠":""), Number(n.group)||0, i, n.id);
      const bigs = g=>{ const mine=rows.filter(d=>gOf(d)===g);
        return mine.length? mine.map((d,i)=>{ const el=note(d[field], "", g, i, keyOf(d)); el.classList.add("big"); return el; }) : [h("div",{class:"p-empty"},"아직 작성 전")]; };
      if(gs.length<2){   // 한 모둠만 맡은 방법: 왼쪽 모둠의 생각, 오른쪽 받은 의견
        const g=gs[0]||m.group;
        board.className="p-board group";
        board.replaceChildren(
          h("section",{class:"p-col g"+g}, h("div",{class:"p-colhead"}, h("span",{class:"gchip g"+g}, g+"모둠의 생각")), h("div",{class:"p-notes"}, bigs(g))),
          field==="value"? h("section",{class:"p-col others"},
            h("div",{class:"p-colhead"}, h("span",{class:"p-n"},"다른 모둠이 덧붙인 생각 "+ns.length+"장")),
            h("div",{class:"p-notes"}, ns.length? ns.map(pn) : h("div",{class:"p-empty"},"공유를 열면 다른 모둠이 생각을 덧붙여요"))) : h("span"));   /* null을 넘기면 화면에 'null' 글자가 찍힘 */
      } else {           // 두 모둠이 맡은 방법: 모둠마다 한 열, 부가적 가치에서는 그 모둠이 받은 포스트잇을 열 아래에
        board.className="p-board cols"+gs.length;
        board.replaceChildren(...gs.map(g=>{ const got=ns.filter(n=>Number(n.tg)===g);
          return h("section",{class:"p-col g"+g},
            h("div",{class:"p-colhead"}, h("span",{class:"gchip g"+g}, g+"모둠의 생각")), h("div",{class:"p-notes"}, bigs(g)),
            field==="value"? h("div",{class:"p-colhead"}, h("span",{class:"p-n"},"다른 모둠이 덧붙인 생각 "+got.length+"장")) : null,
            field==="value"? h("div",{class:"p-notes"}, got.length? got.map(pn) : h("div",{class:"p-empty"},"아직 없음")) : null); }));
      }
    }
  }
  const repaint = ()=>{ paint(); if(spotIdx>=0) drawSpot(); };
  paint(); refreshers.push(repaint);
  root.append(head, qline, board, spot);
  app.append(root);
}
document.addEventListener("keydown", e=>{
  if(view.name!=="present" || /INPUT|SELECT|TEXTAREA/.test((e.target.tagName||""))) return;
  const spotOpen = pSpot && pSpot.isOpen();
  if(e.key==="ArrowRight"||e.key==="ArrowLeft"){
    e.preventDefault();
    const d = e.key==="ArrowRight"? 1 : -1;
    if(spotOpen) pSpot.move(d);                       // 확대 중이면 다음/이전 포스트잇
    else { pField=(pField+d+PFIELDS.length)%PFIELDS.length; render(); }   // 아니면 질문 넘기기
  }
  else if(e.key==="Escape"){ if(spotOpen) pSpot.close(); else go({name:"teacher"}); }
});

/* ---------- GALLERY ---------- */
let noteColor = 1;
function noteEl(n){
  const canDel = isTeacher || n.key===me.key;
  const r = ((Number(n.at)||0)%5-2)*0.8;
  return h("div",{class:"note c"+(n.color||1),style:`--r:${r}deg`},
    n.text, h("small",null,(n.name||"")+(n.group? " · "+n.group+"모둠":"")),
    canDel? h("button",{class:"x","aria-label":"포스트잇 떼기",onclick:()=>write("deleteNote", n.id, me.key, pw)},"×") : null);
}
function renderGallery(){
  // 모둠마다 카드 한 장: 모둠 → 맡은 방법 → 네 칸 답 → 그 모둠에 다른 모둠이 덧붙인 생각(포스트잇)
  const c = viewCls();
  const cols = groupList(c).map(g=>{
    const mid = methodOfGroup(g,c), m = M[mid];
    if(!m) return null;
    const body = h("div",{style:"display:grid;gap:8px"});
    const notes = h("div",{class:"notes"});
    const mine = myGroup()===g && !isTeacher;
    const input = h("input",{class:"field",id:"note-g"+g,maxlength:"80",placeholder:"또 다른 가치는…"});
    const sendBtn = h("button",{class:"btn small primary",type:"submit"},"붙이기");
    const colors = h("div",{class:"colors"},[1,2,3,4].map(k=>h("button",{type:"button","aria-label":"포스트잇 색 "+k,"aria-pressed":String(noteColor===k),style:`background:var(--note${k})`,
      onclick:e=>{ noteColor=k; e.currentTarget.parentNode.querySelectorAll("button").forEach((b,i)=>b.setAttribute("aria-pressed",String(i+1===k))); }})));
    const form = h("form",{class:"nform",onsubmit:async e=>{ e.preventDefault(); const t=input.value.trim(); if(!t) return;
      sendBtn.disabled=true; const cm = consentMeta();
      const ok = await write("addNote",{method:mid,tg:g,text:t,name:me.name||"",cls:c,group:isTeacher?0:myGroup(),key:me.key,color:noteColor,consent:cm});
      if(ok) consentLogged(cm);
      sendBtn.disabled=false; if(ok) input.value=""; }}, input, sendBtn);
    let lastSig="";
    const paint = ()=>{
      const d = S.answers.get(groupId(mid, c, g))||{};
      const ns=[...S.notes.values()].filter(n=>n.method===mid && clsOf(n)===c && Number(n.tg)===g).sort((a,b)=>a.at-b.at);
      const sig = JSON.stringify([d.updatedAt, ns.map(n=>n.id)]); if(sig===lastSig) return; lastSig=sig;
      body.replaceChildren(...[["principle","원리","principle"],["pros","장점","pro"],["cons","단점","con"],["value","부가적 가치","value"]].map(([f,l,k])=>
        h("div",{class:"gblock"},h("div",{class:"lab "+k},l),h("p",{class:(d[f]||"").trim()?"":"muted"},(d[f]||"").trim()||"아직 작성 전"))));
      notes.replaceChildren(...(ns.length? ns.map(noteEl) : [h("span",{class:"muted",style:"font-size:13px"},"첫 포스트잇을 붙여 보세요.")]));
    };
    paint(); refreshers.push(paint);
    return h("section",{class:"gcol g"+g+(mine?" mine":"")},
      h("div",{class:"head"},h("div",{class:"mini",html:ART[mid]}),h("div",null,h("span",{class:"gchip g"+g},g+"모둠"+(mine?" · 우리":"")),h("h3",null,m.title))),
      body,
      h("div",{class:"board"},h("div",{class:"lab value",style:"font-size:12px;font-weight:700"},"다른 모둠이 덧붙인 생각"),notes,
        mine? h("span",{class:"muted",style:"font-size:13px"},"우리 모둠에는 다른 모둠 친구들이 생각을 덧붙여요.") : h("div",{style:"display:grid;gap:6px"},form,colors)));
  });
  const galWrap = h("div",{class:"gal n"+groupCount(c)},cols);
  const lock = h("div",{class:"gal-card"},h("div",null,h("h3",null,"아직 둘러보기 전이에요"),h("span",{class:"muted"},"모든 모둠이 다 쓰면 선생님이 열어 줄 거예요.")));
  const sync = ()=>{ const open=gallOpen()||isTeacher; galWrap.hidden=!open; lock.hidden=open; };
  sync(); refreshers.push(sync);
  app.append(
    h("div",{class:"bar"}, h("button",{class:"btn",onclick:()=>go({name:"home"})},"← 처음으로"),
      h("div",{class:"grow"},h("div",{class:"eyebrow"},c+"반 · 이산화탄소 잡기"),h("h1",{style:"font-size:30px"},"모둠 결과 둘러보기")),
      isTeacher? h("button",{class:"btn primary",onclick:()=>go({name:"teacher"})},"강사 화면"):null),
    lock, galWrap);
}

/* 기기를 돌려 쓸 때: 페이지를 열면 이 기기에 저장된 모둠·이름이 맞는지 한 번 물음.
   다른 사람이면 이 기기의 모둠·이름·동의를 지우고 동의 창부터 다시(앞 학생의 답을 덮어쓰지 않게).
   render가 떠 있는 창을 지우므로, 답할 때까지 첫 화면을 그릴 때마다 다시 띄움(renderHome) */
let whoPending = true;
function askWho(){
  if(isTeacher || S.v===null || document.getElementById("who-h") || !consented() || !me.group || !me.name) return;
  const close = ()=>{ whoPending=false; wrap.remove(); };
  const other = ()=>{ close();
    ["geo-consent","geo-consent-at","geo-consent-logged"].forEach(k=>ls.del(k));
    me = {key:rid(), cls:FIXED_CLS}; saveMe(); go({name:"home"}); };
  const yes = h("button",{class:"btn primary",onclick:close},"네, 맞아요");
  const wrap = h("div",{class:"consent confirm",role:"alertdialog","aria-modal":"true","aria-labelledby":"who-h"},
    h("div",{class:"box",style:"max-width:440px"},
      h("h2",{id:"who-h",style:"font-size:22px"},me.group+"모둠 "+me.name+" 학생인가요?"),
      h("p",{class:"muted",style:"margin:0;font-size:15px"},"이 기기에 남아 있는 이름이에요. 다른 사람이면 [다른 사람이에요]를 눌러 새로 적어 주세요."),
      h("div",{class:"acts"}, h("button",{class:"btn",onclick:other},"다른 사람이에요"), h("span",{class:"grow"}), yes)));
  document.body.append(wrap);
  setTimeout(()=>yes.focus(),0);
}

/* ---------- boot ---------- */
if(!hasGAS){ showBanner(previewMsg); window.__geo={S}; }
// 연결된 시트의 반(파일 이름의 N반)이 주소의 반과 다르면 알림(주소를 잘못 적었을 때)
else call("info").then(o=>{ if(o && Number(o.cls)!==FIXED_CLS) showBanner("이 화면은 "+FIXED_CLS+"반인데 연결된 시트는 "+(o.cls||"?")+"반이에요. 선생님께 알려 주세요."); }).catch(()=>{});   /* 미리보기에서만: 시험용으로 상태를 엶 */
render();
(async ()=>{
  if(pw){ isTeacher = !!(await call("checkTeacher", pw).catch(()=>false)); if(!isTeacher){ pw=""; ls.set("geo-pw",""); } if(isTeacher) render(); }
  await poll();
  setInterval(poll, 15000 + Math.floor(Math.random()*5000));
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) poll(); });
})();
})();

</script>
